name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    uses: ./.github/workflows/windows-release-check.yml
  release:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Validate tag and branch ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          git merge-base --is-ancestor HEAD origin/main
      - name: Full quality gates and vulnerability scan
        run: make tools check vuln
      - name: Build archives
        run: make notices sbom release
      - name: Verify reproducible archives
        run: |
          GOTOOLCHAIN="go$(cat .go-version)" python3 scripts/release.py \
            --version "$(cat VERSION)" --output dist-repro
          for artifact in dist/*.tar.gz dist/*.deb dist/*.zip; do
            cmp "$artifact" "dist-repro/$(basename "$artifact")"
          done
      - name: Verify and smoke-test amd64 archive
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          mkdir smoke
          tar -xzf "scrcpy-tui_$(cat ../VERSION)_linux_amd64.tar.gz" -C smoke
          test "$(smoke/scrcpy-tui --version)" = "$(cat ../VERSION)"
          package="scrcpy-tui_$(cat ../VERSION)_linux_amd64.deb"
          dpkg-deb --info "$package"
          test "$(dpkg-deb --field "$package" Depends)" = "adb"
          test "$(dpkg-deb --field "$package" Suggests)" = "scrcpy"
          dpkg-deb --extract "$package" deb-smoke
          test "$(deb-smoke/usr/bin/scrcpy-tui --version)" = "$(cat ../VERSION)"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-packages
          path: windows-packages
      - name: Include the native-tested MSI and verify matching ZIP
        run: |
          version="$(cat VERSION)"
          cmp "dist/scrcpy-tui_${version}_windows_amd64.zip" "windows-packages/scrcpy-tui_${version}_windows_amd64.zip"
          cp "windows-packages/scrcpy-tui_${version}_windows_amd64.msi" dist/
          cd dist
          sha256sum "scrcpy-tui_${version}_windows_amd64.msi" >> SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.zip
            dist/*.msi
            dist/*.cdx.json
            dist/SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(cat VERSION)"
          awk -v version="$version" '
            index($0, "## " version " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.deb dist/*.zip dist/*.msi dist/*.cdx.json dist/SHA256SUMS \
            --verify-tag --draft --generate-notes --notes-file release-notes.md \
            --title "$RELEASE_TAG"

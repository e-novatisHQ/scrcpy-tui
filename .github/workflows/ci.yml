name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Install pinned development tools
        run: make tools-quality
      - name: Format, vet, tests, static analysis, workflows and PTY
        run: make check
      - name: Module checksums and tidy consistency
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Dependency notices and fixture consistency
        run: |
          make notices fixtures
          test -s THIRD_PARTY_NOTICES.md
          git diff --exit-code -- docs/renderings
      - name: Whitespace
        run: git diff --check
      - name: Coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
  vulnerability:
    name: vulnerability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - run: make tools-vuln vuln
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - run: make test pty
  windows:
    name: windows-amd64
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Native race tests and vet
        shell: pwsh
        run: |
          go test -race -count=1 -timeout=180s ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and smoke-test native CLI
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o bin/scrcpy-tui.exe ./cmd/scrcpy-tui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = & ./bin/scrcpy-tui.exe --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $version) { throw 'Version smoke test failed' }
          & ./bin/scrcpy-tui.exe --config "$env:RUNNER_TEMP/scrcpy-smoke.json" preview --device FAKE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

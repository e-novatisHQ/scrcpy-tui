name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected/actual behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: scrcpy-tui, scrcpy and adb versions
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Linux distribution, architecture and terminal
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: Remove credentials, real serials, personal paths and private addresses.
